[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vessel-morphometry"
version = "0.1.0"
description = "Detect, measure, and vectorise stained xylem vessels in Mulga (Acacia aneura) cross-sections."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Valerie Dobrelya" }]
keywords = ["microscopy", "morphometry", "xylem", "image-analysis", "plant-anatomy"]

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "opencv-python-headless",
    "scikit-image",
    "matplotlib",
    "seaborn",
    "jupyter",
]

[project.optional-dependencies]
# Reading the printed "<N> µm" labels is optional. rapidocr-onnxruntime is pure
# pip (numpy / onnxruntime / opencv, NO system binary) and ships its models in the
# wheel. Without it, calibration degrades to bar-only and you can fill
# `label_um_manual` by hand. Install with: uv pip install -e ".[ocr]"
ocr = ["rapidocr-onnxruntime"]

[tool.hatch.build.targets.wheel]
packages = ["vessel_morphometry"]
